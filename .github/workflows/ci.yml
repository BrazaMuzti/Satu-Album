name: CI (Web App Apps Script)

# Backend sekarang 100% Google Apps Script (folder gas/), jadi repo ini tidak
# punya package.json: tidak ada `npm ci`, test dijalankan langsung dengan Node.
on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  gas:
    name: Test Apps Script (node:test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # `node --check` menolak berkas .gs (ERR_UNKNOWN_FILE_EXTENSION), jadi
      # syntax.mjs mengompilasi semuanya lewat vm.Script.
      - name: Cek sintaks gas/*.gs
        run: node gas/test/syntax.mjs

      # Deteksi helper yang dipanggil tapi tidak terdefinisi di berkas mana pun.
      - name: Cek referensi antar berkas .gs
        run: node gas/test/refs.mjs

      # Uji end-to-end router Code.gs memakai tiruan SpreadsheetApp, DriveApp,
      # CacheService, dan PropertiesService (gas/test/harness.mjs) — tidak butuh
      # kredensial Google sama sekali.
      #
      # Pakai pola glob "*" dalam tanda kutip, bukan nama direktori: di Node 22
      # `node --test gas/test` menganggap argumennya berkas (MODULE_NOT_FOUND),
      # sedangkan dukungan argumen direktori baru ada di Node 24+.
      - name: Jalankan test API
        run: node --test "gas/test/*.test.mjs"
