name: Deploy client ke GitHub Pages

# Build SPA (Vite) lalu publish ke GitHub Pages.
# Prasyarat (sekali saja) di repo → Settings:
#   1. Pages → Source: "GitHub Actions".
#   2. Variables → New repository variable: VITE_API_BASE = https://<service>.onrender.com
#      (tanpa trailing slash). Tanpa ini, SPA akan memanggil /api relatif ke Pages
#      dan gagal — lihat DEPLOYMENT.md §5.
#   3. Repo harus publik (Pages gratis hanya untuk repo publik).
on:
  push:
    branches: [master, main]
    paths:
      - "client/**"
      - ".github/workflows/deploy-client-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Install dependency
        run: npm ci
        working-directory: client
      - name: Build
        working-directory: client
        env:
          # Project site → https://<user>.github.io/<repo>/ .
          # Ganti ke "/" bila memakai custom domain, lalu set pathSegmentsToKeep=0
          # di client/public/404.html.
          VITE_BASE: /${{ github.event.repository.name }}/
          VITE_API_BASE: ${{ vars.VITE_API_BASE }}
        run: npm run build
      # Folder aset Vite tidak diawali "_", tapi .nojekyll tetap aman untuk
      # memastikan Jekyll tidak memproses hasil build.
      - name: Tambah .nojekyll
        run: touch dist/.nojekyll
        working-directory: client
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: client/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
