<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <title>Satu-Album</title>
    <script>
      /* Fallback SPA untuk GitHub Pages (Pages tidak punya rewrite server).
         Halaman 404 ini menyimpan path asli ke query (?/events/<slug>) lalu kembali
         ke index.html, yang membaca ulang query tersebut (lihat skrip di index.html).

         pathSegmentsToKeep:
           1 = GitHub Pages *project site*  → https://<user>.github.io/<repo>/events/<slug>
           0 = custom domain / user page    → https://satu-album.example.com/events/<slug> */
      var pathSegmentsToKeep = 1;
      (function (l) {
        l.replace(
          l.protocol + "//" + l.hostname + (l.port ? ":" + l.port : "") +
          l.pathname.split("/").slice(0, 1 + pathSegmentsToKeep).join("/") + "/?/" +
          l.pathname.slice(1).split("/").slice(pathSegmentsToKeep).join("/").replace(/&/g, "~and~") +
          (l.search ? "&" + l.search.slice(1).replace(/&/g, "~and~") : "") +
          l.hash
        );
      })(window.location);
    </script>
  </head>
  <body></body>
</html>
