<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Satu-Album • kamera</title>
  </head>
  <body>
    <div id="root"></div>
    <!-- GitHub Pages: 404.html mengalihkan /events/<slug> menjadi ?/events/<slug>.
         Skrip ini mengembalikan path aslinya sebelum React Router membaca location. -->
    <script>
      (function (l) {
        if (l.search[1] !== "/") return;
        var decoded = l.search.slice(1).split("&").map(function (s) {
          return s.replace(/~and~/g, "&");
        }).join("?");
        window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
      })(window.location);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
