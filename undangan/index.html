<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Menu utama undangan digital Satu-Album: kamera, galeri, undangan, RSVP, buku tamu, amplop." />
  <title>Satu-Album · Menu Utama</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:wght@400;600;700&family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <!-- FontAwesome 6 (CDN) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <!-- CSS -->
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/dashboard.css" />
</head>
<body class="dashboard">

  <!-- ===== Header Dashboard ===== -->
  <header class="dash-hero">
    <a class="logo" href="index.html" aria-label="Beranda">
      <i class="fa-solid fa-camera-retro"></i><span>Satu-Album</span>
    </a>
    <h1>Menu Utama</h1>
    <p class="sub">Selamat datang! Pilih menu untuk membuka undangan, kamera, galeri, dan fitur acara lainnya.</p>
    <div class="divider" aria-hidden="true"></div>
  </header>

  <!-- ===== Grid Menu (8 kartu) ===== -->
  <main class="menu-grid">

    <button class="dash-card" data-menu="kamera" data-accent="sage">
      <span class="card-icon"><i class="fa-solid fa-camera"></i></span>
      <h3>Camera / Scan QR</h3>
      <p>Buka mode kamera acara, pindai QR, atau memotret momen.</p>
      <span class="card-go">Buka <i class="fa-solid fa-arrow-right"></i></span>
    </button>

    <button class="dash-card" data-menu="galeri" data-accent="sky">
      <span class="card-icon"><i class="fa-regular fa-images"></i></span>
      <h3>Galeri</h3>
      <p>Koleksi foto &amp; video momen kebersamaan para tamu.</p>
      <span class="card-go">Buka <i class="fa-solid fa-arrow-right"></i></span>
    </button>

    <button class="dash-card" data-menu="undangan" data-accent="lavender">
      <span class="card-icon"><i class="fa-solid fa-envelope-open-text"></i></span>
      <h3>Undangan</h3>
      <p>Tampilan utama undangan digital pernikahan.</p>
      <span class="card-go">Buka <i class="fa-solid fa-arrow-right"></i></span>
    </button>

    <button class="dash-card" data-menu="rsvp" data-accent="rose">
      <span class="card-icon"><i class="fa-solid fa-clipboard-check"></i></span>
      <h3>Konfirmasi Kehadiran</h3>
      <p>RSVP Hadir / Berhalangan pada undangan.</p>
      <span class="card-go">Isi <i class="fa-solid fa-arrow-right"></i></span>
    </button>

    <button class="dash-card" data-menu="bukutamu" data-accent="rose">
      <span class="card-icon"><i class="fa-solid fa-book"></i></span>
      <h3>Buku Tamu &amp; Ucapan</h3>
      <p>Berikan ucapan &amp; doa terbaik untuk kedua mempelai.</p>
      <span class="card-go">Tulis <i class="fa-solid fa-arrow-right"></i></span>
    </button>

    <button class="dash-card" data-menu="amplop" data-accent="gold">
      <span class="card-icon"><i class="fa-solid fa-gift"></i></span>
      <h3>Amplop Digital / Hadiah</h3>
      <p>Kirim tanda kasih secara digital untuk mempelai.</p>
      <span class="card-go">Kirim <i class="fa-solid fa-arrow-right"></i></span>
    </button>

    <button class="dash-card" data-menu="pengaturan" data-accent="peach">
      <span class="card-icon"><i class="fa-solid fa-music"></i></span>
      <h3>Pengaturan Tema &amp; Musik</h3>
      <p>Sesuaikan backsound dan nuansa tema undangan.</p>
      <span class="card-go">Atur <i class="fa-solid fa-arrow-right"></i></span>
    </button>

    <button class="dash-card" data-menu="admin" data-accent="graphite">
      <span class="card-icon"><i class="fa-solid fa-user-gear"></i></span>
      <h3>Admin</h3>
      <p>Panel pengelola acara, RSVP, dan statistik.</p>
      <span class="card-go">Kelola <i class="fa-solid fa-arrow-right"></i></span>
    </button>

  </main>

  <!-- ===== Modal ===== -->
  <div class="modal-overlay" id="modalOverlay" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal-head">
        <span class="m-icon" id="modalIcon"><i class="fa-solid fa-star"></i></span>
        <h3 id="modalTitle">Menu</h3>
        <button class="m-close" id="modalClose" aria-label="Tutup"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div class="modal-body" id="modalBody"></div>
      <div class="modal-actions" id="modalActions"></div>
    </div>
  </div>

  <footer class="dash-footer">© 2026 Satu-Album · dibuat dengan <i class="fa-solid fa-heart" style="color:#c98f74"></i> untuk acara spesial.</footer>

  <script src="js/invitation.js" defer></script>
</body>
</html>
