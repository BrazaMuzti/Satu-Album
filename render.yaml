# Blueprint Render untuk API Satu-Album (opsi 1: Render free + Google Drive).
#
# Cara pakai: Render → New → Blueprint → pilih repo ini → isi env yang bertanda
# `sync: false` (diisi manual di dashboard, tidak disimpan di repo).
#
# Catatan penting free tier:
#   - Disk ephemeral → metadata & foto WAJIB di Google Drive (Google Drive = sumber
#     kebenaran; lihat DEPLOYMENT.md §3 dan server/src/drive-store.js).
#   - Instance tidur setelah ~15 menit tanpa trafik → permintaan pertama bisa
#     memakan waktu sampai ~1 menit (cold start). Ini normal dan tidak menghilangkan
#     data, karena semua isi album dibaca ulang dari Drive saat boot.
#
# PORT sengaja TIDAK di-set di sini: Render menyuntikkan PORT sendiri dan server
# membacanya (server/src/config.js). Menyetel PORT manual bisa menabrak port Render.
services:
  - type: web
    name: satu-album-api
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0

      # ── Wajib diisi manual ──────────────────────────────────────────────
      # Token panitia: dipakai untuk membuat album & menghapus foto.
      # Buat acak: node -e "console.log(require('crypto').randomBytes(24).toString('hex'))"
      - key: ADMIN_TOKEN
        sync: false
      # URL publik API ini sendiri, ex: https://satu-album-api.onrender.com
      - key: PUBLIC_BASE_URL
        sync: false
      # Domain client yang boleh memanggil API. Origin saja, dipisah koma.
      # ex: https://<user>.github.io,https://satu-album.vercel.app
      - key: ALLOWED_ORIGIN
        sync: false

      # ── Kredensial Google Drive (ambil refresh token via `npm run token`) ──
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REFRESH_TOKEN
        sync: false
      - key: GOOGLE_DRIVE_ROOT_FOLDER_NAME
        value: Satu-Album

      # ── Batas & pengaman (ubah bila perlu) ─────────────────────────────
      - key: MAX_UPLOAD_MB
        value: "8"
      - key: MAX_PHOTOS_PER_EVENT
        value: "800"
      - key: RATE_CREATE_PER_HOUR
        value: "10"
      - key: RATE_UPLOAD_PER_HOUR
        value: "300"
      - key: SA_UNDO_WINDOW_MS
        value: "120000"
      - key: SA_CACHE_TTL_MS
        value: "10000"
